name: Build n8n Robot Framework Images

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version (empty = versions.env)'
        required: false
        type: string
      n8n_version:
        description: 'n8n version (empty = versions.env)'
        required: false
        type: string
      robotframework_version:
        description: 'Robot Framework version (empty = versions.env)'
        required: false
        type: string
      rf_browser_version:
        description: 'robotframework-browser version (empty = versions.env)'
        required: false
        type: string
      rf_assertion_engine_version:
        description: 'robotframework-assertion-engine version (empty = versions.env)'
        required: false
        type: string
      rf_jsonlibrary_version:
        description: 'robotframework-jsonlibrary version (empty = versions.env)'
        required: false
        type: string

env:
  DOCKERHUB_USERNAME: delilovic

jobs:
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.versions.outputs.NODE_VERSION }}
      n8n_version: ${{ steps.versions.outputs.N8N_VERSION }}
      robotframework_version: ${{ steps.versions.outputs.ROBOTFRAMEWORK_VERSION }}
      rf_browser_version: ${{ steps.versions.outputs.RF_BROWSER_VERSION }}
      rf_assertion_engine_version: ${{ steps.versions.outputs.RF_ASSERTION_ENGINE_VERSION }}
      rf_jsonlibrary_version: ${{ steps.versions.outputs.RF_JSONLIBRARY_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions.env and apply inputs
        id: versions
        env:
          IN_NODE_VERSION: ${{ inputs.node_version }}
          IN_N8N_VERSION: ${{ inputs.n8n_version }}
          IN_ROBOTFRAMEWORK_VERSION: ${{ inputs.robotframework_version }}
          IN_RF_BROWSER_VERSION: ${{ inputs.rf_browser_version }}
          IN_RF_ASSERTION_ENGINE_VERSION: ${{ inputs.rf_assertion_engine_version }}
          IN_RF_JSONLIBRARY_VERSION: ${{ inputs.rf_jsonlibrary_version }}
        run: |
          source ./versions.env
          for name in NODE_VERSION N8N_VERSION ROBOTFRAMEWORK_VERSION RF_BROWSER_VERSION RF_ASSERTION_ENGINE_VERSION RF_JSONLIBRARY_VERSION; do
            input="IN_$name"
            value="${!input:-${!name}}"
            if [ -z "$value" ]; then
              echo "$name is not set in versions.env or the workflow inputs" >&2
              exit 1
            fi
            echo "$name=$value" | tee -a "$GITHUB_OUTPUT"
          done

  build-n8n-base:
    name: Build n8n_base
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push n8n_base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/images/n8n-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=${{ needs.versions.outputs.node_version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n_base:${{ needs.versions.outputs.node_version }}-bookworm-slim

  build-n8n:
    name: Build n8n
    runs-on: ubuntu-latest
    needs: [versions, build-n8n-base]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push n8n
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/images/n8n/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=${{ needs.versions.outputs.node_version }}
            N8N_VERSION=${{ needs.versions.outputs.n8n_version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n:${{ needs.versions.outputs.n8n_version }}-bookworm-slim
            ${{ env.DOCKERHUB_USERNAME }}/n8n:latest

  build-n8n-robotframework:
    name: Build n8n-robotframework
    runs-on: ubuntu-latest
    needs: [versions, build-n8n]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push n8n-robotframework
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/images/n8n-robotframework/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            N8N_VERSION=${{ needs.versions.outputs.n8n_version }}
            ROBOTFRAMEWORK_VERSION=${{ needs.versions.outputs.robotframework_version }}
            RF_BROWSER_VERSION=${{ needs.versions.outputs.rf_browser_version }}
            RF_ASSERTION_ENGINE_VERSION=${{ needs.versions.outputs.rf_assertion_engine_version }}
            RF_JSONLIBRARY_VERSION=${{ needs.versions.outputs.rf_jsonlibrary_version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n_robotframework:${{ needs.versions.outputs.n8n_version }}-bookworm-slim
            ${{ env.DOCKERHUB_USERNAME }}/n8n_robotframework:latest
