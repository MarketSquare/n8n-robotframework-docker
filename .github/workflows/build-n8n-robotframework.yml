name: Build n8n Robot Framework Images

on:
  workflow_dispatch:
    # Default versions for all images. This is the only place to change them;
    # docker/images/build-n8n-robotframework.sh reads them from here as well.
    inputs:
      # Node.js 24, not 26 (which upstream n8n uses): @confluentinc/kafka-javascript,
      # a native n8n dependency, has no prebuilt binary for Node.js 26 and does not
      # compile against the old librdkafka in Debian Bookworm, so the n8n image fails
      # to build. Node.js 24 has prebuilt binaries, is an official upstream n8n base
      # version, and meets n8n's requirement of Node.js >= 24.
      # Move to 26 once kafka-javascript publishes "node-v147" binaries:
      # https://github.com/confluentinc/confluent-kafka-javascript/releases
      node_version:
        description: 'Node.js version'
        required: true
        default: '24.22.2'
        type: string
      n8n_version:
        description: 'n8n version'
        required: true
        default: '2.48.6'
        type: string
      robotframework_version:
        description: 'Robot Framework version'
        required: true
        default: '7.5.1'
        type: string
      rf_browser_version:
        description: 'robotframework-browser version'
        required: true
        default: '21.0.0'
        type: string
      # Must match the version required by robotframework-browser
      rf_assertion_engine_version:
        description: 'robotframework-assertion-engine version'
        required: true
        default: '5.0.1'
        type: string
      rf_jsonlibrary_version:
        description: 'robotframework-jsonlibrary version'
        required: true
        default: '0.5'
        type: string

env:
  DOCKERHUB_USERNAME: delilovic

jobs:
  build-n8n-base:
    name: Build n8n_base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push n8n_base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/images/n8n-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=${{ inputs.node_version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n_base:${{ inputs.node_version }}-bookworm-slim

  build-n8n:
    name: Build n8n
    runs-on: ubuntu-latest
    needs: build-n8n-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push n8n
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/images/n8n/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=${{ inputs.node_version }}
            N8N_VERSION=${{ inputs.n8n_version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n:${{ inputs.n8n_version }}-bookworm-slim
            ${{ env.DOCKERHUB_USERNAME }}/n8n:latest

  build-n8n-robotframework:
    name: Build n8n-robotframework
    runs-on: ubuntu-latest
    needs: build-n8n
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push n8n-robotframework
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/images/n8n-robotframework/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            N8N_VERSION=${{ inputs.n8n_version }}
            ROBOTFRAMEWORK_VERSION=${{ inputs.robotframework_version }}
            RF_BROWSER_VERSION=${{ inputs.rf_browser_version }}
            RF_ASSERTION_ENGINE_VERSION=${{ inputs.rf_assertion_engine_version }}
            RF_JSONLIBRARY_VERSION=${{ inputs.rf_jsonlibrary_version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n_robotframework:${{ inputs.n8n_version }}-bookworm-slim
            ${{ env.DOCKERHUB_USERNAME }}/n8n_robotframework:latest
